services:
  - type: web
    name: agr-beta-epsilon
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agr-beta-epsilon-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://asu-agr-be.org
      - key: ADMIN_EMAIL
        value: hagaragrfinance@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
databases:
  - name: agr-beta-epsilon-db
    plan: basic-256mb
    databaseName: agr_beta_epsilon
    user: agr_be_user
